<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <div id="app" class="container my-4">
      <h1 class="text-center mb-4">Event information</h1>

      <div class="row g-3">
        <div class="col-12 col-sm-6 col-lg-3">
          <label for="eventId" class="form-label">Event ID</label>
          <input
            type="text"
            id="eventId"
            class="form-control"
            v-model="searchEventId"
          />
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
          <label for="eventName" class="form-label">Event Name</label>
          <input
            type="text"
            id="eventName"
            class="form-control"
            v-model="searchEventName"
          />
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
          <label for="duration" class="form-label">Duration</label>
          <input
            type="number"
            id="duration"
            class="form-control"
            v-model="searchDuration"
          />
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
          <label class="form-label d-block">Category</label>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              id="all"
              name="category"
              value="All"
              v-model="selectedCategory"
            />
            <label class="form-check-label" for="all">All</label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              id="tech"
              name="category"
              value="Technology"
              v-model="selectedCategory"
            />
            <label class="form-check-label" for="tech">Technology</label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              id="business"
              name="category"
              value="Business"
              v-model="selectedCategory"
            />
            <label class="form-check-label" for="business">Business</label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              id="marketing"
              name="category"
              value="Marketing"
              v-model="selectedCategory"
            />
            <label class="form-check-label" for="marketing">Marketing</label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              id="finance"
              name="category"
              value="Finance"
              v-model="selectedCategory"
            />
            <label class="form-check-label" for="finance">Finance</label>
          </div>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-12">
          <div class="table-responsive">
            <table class="table table-striped table-bordered" v-if="filteredEvents.length > 0">
              <thead>
                <tr>
                  <th>Event ID</th>
                  <th>Event Name</th>
                  <th>Category</th>
                  <th>Duration (Hours)</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="e in filteredEvents" :key="e.eventid">
                  <td>{{e.eventid}}</td>
                  <td>{{e.eventname}}</td>
                  <td>{{e.category}}</td>
                  <td>{{e.durationhour}}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <p v-else class="text-center text-muted">No Events found</p>
        </div>
      </div>
    </div>

    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            searchEventId: "",
            searchEventName: "",
            searchDuration: "",
            selectedCategory: "All",
            events: [
              {
                eventid: "EVT10001",
                eventname: "Tech Innovations Conference",
                category: "Technology",
                durationhour: 8,
              },
              {
                eventid: "EVT10002",
                eventname: "Startup Pitch Day",
                category: "Business",
                durationhour: 6,
              },
              {
                eventid: "EVT10003",
                eventname: "AI & Machine Learning Summit",
                category: "Technology",
                durationhour: 10,
              },
              {
                eventid: "EVT10004",
                eventname: "Cybersecurity Workshop",
                category: "Technology",
                durationhour: 4,
              },
              {
                eventid: "EVT10005",
                eventname: "Digital Marketing Bootcamp",
                category: "Marketing",
                durationhour: 6,
              },
              {
                eventid: "EVT10006",
                eventname: "Blockchain and Cryptocurrency",
                category: "Finance",
                durationhour: 5,
              },
              {
                eventid: "EVT10007",
                eventname: "Entrepreneurship Forum",
                category: "Business",
                durationhour: 7,
              },
              {
                eventid: "EVT10008",
                eventname: "Data Science Hackathon",
                category: "Technology",
                durationhour: 12,
              },
              {
                eventid: "EVT10009",
                eventname: "Leadership and Management Summit",
                category: "Business",
                durationhour: 9,
              },
              {
                eventid: "EVT10010",
                eventname: "E-commerce Strategies",
                category: "Marketing",
                durationhour: 6,
              },
              {
                eventid: "EVT10011",
                eventname: "AI for Business",
                category: "Business",
                durationhour: 8,
              },
              {
                eventid: "EVT10012",
                eventname: "IoT & Smart Devices Expo",
                category: "Technology",
                durationhour: 7,
              },
              {
                eventid: "EVT10013",
                eventname: "Brand Strategy and Growth",
                category: "Marketing",
                durationhour: 5,
              },
              {
                eventid: "EVT10014",
                eventname: "Investment and Wealth Management",
                category: "Finance",
                durationhour: 6,
              },
              {
                eventid: "EVT10015",
                eventname: "Financial Technology (FinTech) Summit",
                category: "Finance",
                durationhour: 8,
              },
              {
                eventid: "EVT10016",
                eventname: "AI Ethics and Regulations",
                category: "Technology",
                durationhour: 4,
              },
              {
                eventid: "EVT10017",
                eventname: "Business Analytics Workshop",
                category: "Business",
                durationhour: 6,
              },
              {
                eventid: "EVT10018",
                eventname: "SEO and Content Marketing",
                category: "Marketing",
                durationhour: 7,
              },
              {
                eventid: "EVT10019",
                eventname: "Cryptocurrency Investment Strategies",
                category: "Finance",
                durationhour: 9,
              },
              {
                eventid: "EVT10020",
                eventname: "Social Media Marketing Trends",
                category: "Marketing",
                durationhour: 5,
              },
            ],
          };
        },
        computed: {
          filteredEvents() {
            return this.events.filter((e) => {
              const matchId = e.eventid.toLowerCase().includes(this.searchEventId.trim().toLowerCase());
              const matchName = e.eventname.toLowerCase().includes(this.searchEventName.trim().toLowerCase());
              const matchDuration = !this.searchDuration || e.durationhour == this.searchDuration;
              const matchCategory = this.selectedCategory == "All" || e.category == this.selectedCategory
              return matchId && matchName && matchDuration && matchCategory;
            });
          },
        },
        methods: {},
      }).mount("#app");
    </script>
  </body>
</html>
