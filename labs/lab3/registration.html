<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Registration</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <div id="app" class="container my-4">
      <h1 class="text-center mb-4">Register form</h1>
      <h2>Login information</h2>

      <div class="row mb-3">
        <div class="col-md-4">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            class="form-control"
            v-model="username"
          />
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            v-model="password"
          />
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label for="confirmPassword" class="form-label"
            >Re-enter Password</label
          >
          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            v-model="confirmPassword"
          />
        </div>
        <div class="col-md-6 d-flex align-items-end pb-2">
          <span
            v-if="confirmPassword && password !== confirmPassword"
            class="text-danger"
          >
            Passwords do not match
          </span>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-12 col-md-6">
          <h2>Event category</h2>
          <div class="mt-2">
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                id="cat-all"
                name="category"
                value="All"
                v-model="selectedCategory"
              />
              <label class="form-check-label" for="cat-all">All</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                id="cat-tech"
                name="category"
                value="Technology"
                v-model="selectedCategory"
              />
              <label class="form-check-label" for="cat-tech">Technology</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                id="cat-business"
                name="category"
                value="Business"
                v-model="selectedCategory"
              />
              <label class="form-check-label" for="cat-business"
                >Business</label
              >
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                id="cat-marketing"
                name="category"
                value="Marketing"
                v-model="selectedCategory"
              />
              <label class="form-check-label" for="cat-marketing"
                >Marketing</label
              >
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                id="cat-finance"
                name="category"
                value="Finance"
                v-model="selectedCategory"
              />
              <label class="form-check-label" for="cat-finance">Finance</label>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <h2>Event Name</h2>
          <div class="mt-2">
            <select class="form-select" id="eventName" v-model="selectedEvent">
              <option value="" disabled>Please select an event</option>
              <option
                v-for="e in filteredEventsByCategory"
                :key="e.eventid"
                :value="e.eventname"
              >
                {{ e.eventname }}
              </option>
            </select>
          </div>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-12">
          <h2>Summary</h2>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <p>Username: {{ username }}</p>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <p>Category: {{ selectedCategory }}</p>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <p>Event Name: {{ selectedEvent }}</p>
        </div>
      </div>
    </div>

    <script>

            ],
          };
        },
        computed: {
          filteredEventsByCategory() {
            if (this.selectedCategory === "All") {
              return this.events;
            }
            return this.events.filter(
              (e) => e.category === this.selectedCategory,
            );
          },
        },
        methods: {},
      }).mount("#app");
    </script>
  </body>
</html>
